services:
  postgres:
    image: pgvector/pgvector:pg16   # Postgres 16 + pgvector (filing_chunks.embedding)
    container_name: exposure-postgres
    restart: unless-stopped
    # V7-D10. The default 100 is not a budget anyone chose: every process here
    # holds pool_size=10 + max_overflow=20, so api + mcp + three workers can ask
    # for 150 and the sixth replica to start would be refused by the database
    # rather than by anything that knows why. 200 costs a few MB of shared
    # memory on a box with 3.8 GB. shared_buffers moves with it — 128MB is the
    # image default, not a reading of this machine.
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
    environment:
      POSTGRES_USER: exposure
      POSTGRES_PASSWORD: exposure
      POSTGRES_DB: exposure_workbench
    ports:
      # Loopback only. Docker publishes straight past ufw, so a bare "5433:5432"
      # put Postgres — credentials exposure/exposure — on the public internet.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exposure -d exposure_workbench"]
      interval: 5s
      timeout: 5s
      retries: 10

  exposure-mcp:
    # MCP_PLAN R3. The agent tool face, resident: /mcp/meta and /mcp/research,
    # streamable HTTP, stateless. Tool execution lives here (N10), so this
    # container needs the providers and the database the tools reach.
    build:
      context: .
      dockerfile: infra/Dockerfile.mcp
    container_name: exposure-mcp
    restart: unless-stopped
    ports:
      # Loopback only, and for one reason: the live suite runs from the host and
      # the parity guard — a direct invoke() and the same call over HTTP record
      # the same row — is not a guard if it cannot reach this face. The posture
      # is the one Postgres already has two services up: bound to 127.0.0.1 so
      # Docker cannot publish it past ufw, and behind a credential (there, the
      # role password; here, an HS256 bearer signed with MCP_INTERNAL_SECRET).
      # Anything wider would put the whole tool surface on a public interface.
      - "127.0.0.1:${MCP_HOST_PORT:-8104}:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://exposure:exposure@postgres:5432/exposure_workbench"
      DATABASE_URL_APP: "${DATABASE_URL_APP:-postgresql+asyncpg://app_rls:app_rls_pw@postgres:5432/exposure_workbench}"
      # Retrieval embeds inside the tools; completion does not happen here at
      # all — the LLM call stays in the api and worker loops.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.4-mini}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      EDGAR_IDENTITY: "${EDGAR_IDENTITY:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # N7. The one key the middleware verifies bearers with. Empty is refused
      # at startup: an unverified tool face is worse than a dead one.
      MCP_INTERNAL_SECRET: "${MCP_INTERNAL_SECRET:-}"
      # The delegation tools charge quota through task_service, which now runs
      # in this container. These pools must be the same numbers as in the api
      # or the two disagree about the same user's day.
      DAILY_CHAT_TURNS: "${DAILY_CHAT_TURNS:-10}"
      DAILY_RESEARCH_RUNS: "${DAILY_RESEARCH_RUNS:-3}"
      DAILY_READINESS: "${DAILY_READINESS:-10}"
      DAILY_EXPOSURE_RUNS: "${DAILY_EXPOSURE_RUNS:-20}"
      DAILY_MARKET_SYNCS: "${DAILY_MARKET_SYNCS:-10}"
      GLOBAL_DAILY_CHAT_TURNS: "${GLOBAL_DAILY_CHAT_TURNS:-200}"
      GLOBAL_DAILY_RESEARCH_RUNS: "${GLOBAL_DAILY_RESEARCH_RUNS:-30}"
      GLOBAL_DAILY_READINESS: "${GLOBAL_DAILY_READINESS:-100}"
      GLOBAL_DAILY_EXPOSURE_RUNS: "${GLOBAL_DAILY_EXPOSURE_RUNS:-200}"
      GLOBAL_DAILY_MARKET_SYNCS: "${GLOBAL_DAILY_MARKET_SYNCS:-50}"
      # V2-H added three pools and stopped here, so the comment above ("tunable
      # without a rebuild") was false for exactly the three that bound a tester
      # first: 5 chat sessions a day cannot be raised without editing this file.
      DAILY_PORTFOLIO_CREATES: "${DAILY_PORTFOLIO_CREATES:-5}"
      DAILY_POSITION_UPLOADS: "${DAILY_POSITION_UPLOADS:-10}"
      DAILY_AGENT_SESSIONS: "${DAILY_AGENT_SESSIONS:-5}"
      GLOBAL_DAILY_PORTFOLIO_CREATES: "${GLOBAL_DAILY_PORTFOLIO_CREATES:-100}"
      GLOBAL_DAILY_POSITION_UPLOADS: "${GLOBAL_DAILY_POSITION_UPLOADS:-100}"
      GLOBAL_DAILY_AGENT_SESSIONS: "${GLOBAL_DAILY_AGENT_SESSIONS:-100}"
      # V7-Q. Comma-separated user ids exempt from the REFUSAL — still counted.
      # Empty here and empty in Settings: two places, both off by default.
      QUOTA_UNLIMITED_USERS: "${QUOTA_UNLIMITED_USERS:-}"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    healthcheck:
      # A python-slim image has neither curl nor wget, and installing one to
      # run a probe is a package the runtime never uses otherwise. /healthz is
      # unauthenticated by design; urlopen raises on anything but 2xx.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  exposure-api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: exposure-api
    restart: unless-stopped
    ports:
      # Loopback only: Caddy reverse-proxies to it. Published on 0.0.0.0 the API
      # would be reachable directly, defeating same-origin CORS entirely.
      - "127.0.0.1:${API_HOST_PORT:-8103}:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://exposure:exposure@postgres:5432/exposure_workbench"
      # V2-C: runtime uses the non-owner app_rls role so RLS policies bind.
      DATABASE_URL_APP: "${DATABASE_URL_APP:-postgresql+asyncpg://app_rls:app_rls_pw@postgres:5432/exposure_workbench}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.4-mini}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      EDGAR_IDENTITY: "${EDGAR_IDENTITY:-}"
      REPORT_AGENT_MODE: "${REPORT_AGENT_MODE:-direct_llm}"
      DEMO_MODE: "${DEMO_MODE:-true}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # MCP_PLAN R3/N7. The meta-agent mints a bearer per turn from this secret
      # and reaches the tool face over the compose network. An empty secret is
      # a startup failure, not a request sent unsigned.
      MCP_URL: "${MCP_URL:-http://exposure-mcp:8000}"
      MCP_INTERNAL_SECRET: "${MCP_INTERNAL_SECRET:-}"
      # Same-origin production needs no entry here at all; these are the dev origins.
      CORS_ORIGINS: "${CORS_ORIGINS-http://localhost:${WEB_HOST_PORT:-3103},http://127.0.0.1:${WEB_HOST_PORT:-3103}}"
      CLERK_ISSUER: "${CLERK_ISSUER:-}"
      CLERK_AUTHORIZED_PARTIES: "${CLERK_AUTHORIZED_PARTIES:-}"
      # V2-E2/E3. Quota units are user actions per UTC day; the GLOBAL_* pools are
      # the shared backstop across everyone. Both are what stands between a public
      # link and an unbounded bill, so they are tunable without a rebuild.
      TURN_LEASE_SECONDS: "${TURN_LEASE_SECONDS:-900}"
      # V3-B1. Without this line the refusal threshold cannot be changed on a
      # running deployment, which also makes it untestable there.
      CONTEXT_SOFT_LIMIT_TOKENS: "${CONTEXT_SOFT_LIMIT_TOKENS:-80000}"
      DAILY_CHAT_TURNS: "${DAILY_CHAT_TURNS:-10}"
      DAILY_RESEARCH_RUNS: "${DAILY_RESEARCH_RUNS:-3}"
      DAILY_READINESS: "${DAILY_READINESS:-10}"
      DAILY_EXPOSURE_RUNS: "${DAILY_EXPOSURE_RUNS:-20}"
      DAILY_MARKET_SYNCS: "${DAILY_MARKET_SYNCS:-10}"
      GLOBAL_DAILY_CHAT_TURNS: "${GLOBAL_DAILY_CHAT_TURNS:-200}"
      GLOBAL_DAILY_RESEARCH_RUNS: "${GLOBAL_DAILY_RESEARCH_RUNS:-30}"
      GLOBAL_DAILY_READINESS: "${GLOBAL_DAILY_READINESS:-100}"
      GLOBAL_DAILY_EXPOSURE_RUNS: "${GLOBAL_DAILY_EXPOSURE_RUNS:-200}"
      GLOBAL_DAILY_MARKET_SYNCS: "${GLOBAL_DAILY_MARKET_SYNCS:-50}"
      # V2-H added three pools and stopped here, so the comment above ("tunable
      # without a rebuild") was false for exactly the three that bound a tester
      # first: 5 chat sessions a day cannot be raised without editing this file.
      DAILY_PORTFOLIO_CREATES: "${DAILY_PORTFOLIO_CREATES:-5}"
      DAILY_POSITION_UPLOADS: "${DAILY_POSITION_UPLOADS:-10}"
      DAILY_AGENT_SESSIONS: "${DAILY_AGENT_SESSIONS:-5}"
      GLOBAL_DAILY_PORTFOLIO_CREATES: "${GLOBAL_DAILY_PORTFOLIO_CREATES:-100}"
      GLOBAL_DAILY_POSITION_UPLOADS: "${GLOBAL_DAILY_POSITION_UPLOADS:-100}"
      GLOBAL_DAILY_AGENT_SESSIONS: "${GLOBAL_DAILY_AGENT_SESSIONS:-100}"
      # V7-Q. Comma-separated user ids exempt from the REFUSAL — still counted.
      # Empty here and empty in Settings: two places, both off by default.
      QUOTA_UNLIMITED_USERS: "${QUOTA_UNLIMITED_USERS:-}"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      exposure-mcp:
        condition: service_healthy

  exposure-worker:
    # No container_name: it would make `docker compose up --scale exposure-worker=N`
    # fail on a name collision. Replicas get the compose-generated name, and
    # WORKER_ID (socket.gethostname() = the 12-char container id) differs per
    # replica with no code change.
    #
    # V7-D10: three of them. process_one handles ONE task at a time, and a cold
    # issuer_research is minutes of EDGAR ingest plus a thirty-turn agent loop —
    # with one replica the third user to press Investigate waits behind two runs
    # that have nothing to do with them. Safe because claim_next_task takes the
    # row FOR UPDATE SKIP LOCKED and dates the lease from the SERVER clock, so
    # replicas never claim the same task and never disagree about when a lease
    # expired. The number is a scheduling choice, not a correctness one.
    deploy:
      replicas: 3
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    environment:
      DATABASE_URL: "postgresql+asyncpg://exposure:exposure@postgres:5432/exposure_workbench"
      DATABASE_URL_APP: "${DATABASE_URL_APP:-postgresql+asyncpg://app_rls:app_rls_pw@postgres:5432/exposure_workbench}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.4-mini}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      EDGAR_IDENTITY: "${EDGAR_IDENTITY:-}"
      REPORT_AGENT_MODE: "${REPORT_AGENT_MODE:-direct_llm}"
      DEMO_MODE: "${DEMO_MODE:-true}"
      WORKER_POLL_INTERVAL: "${WORKER_POLL_INTERVAL:-2}"
      # V2-E1 lease. Override to a few seconds to exercise takeover; the
      # production value must exceed the slowest real task.
      TASK_LEASE_SECONDS: "${TASK_LEASE_SECONDS:-1800}"
      TASK_MAX_RETRIES: "${TASK_MAX_RETRIES:-3}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # MCP_PLAN R3/N7. The research subagent mints a bearer per run from this
      # secret, whose 30-minute ttl is TASK_LEASE_SECONDS above. An empty
      # secret is a startup failure, not a request sent unsigned.
      MCP_URL: "${MCP_URL:-http://exposure-mcp:8000}"
      MCP_INTERNAL_SECRET: "${MCP_INTERNAL_SECRET:-}"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      postgres:
        condition: service_healthy
      exposure-mcp:
        condition: service_healthy

  exposure-web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        # Empty in production (same origin behind Caddy); localhost for dev.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL-http://localhost:${API_HOST_PORT:-8103}}"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}"
    container_name: exposure-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3103}:3000"
    environment:
      # server-side (SSR) Clerk needs these at runtime; publishable key is also
      # inlined at build time via the build arg above.
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY:-}"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}"
    depends_on:
      - exposure-api

volumes:
  postgres_data:
