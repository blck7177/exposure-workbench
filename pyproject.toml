[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure-workbench"
version = "0.1.0"
description = "Portfolio Exposure Workflow Demo — database-backed analytical workflow with LLM reporting"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "langgraph>=0.1",
    "langchain-openai>=0.1",
    "yfinance>=0.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    # ─── Issuer Intelligence (P0+) ────────────────────────────────────────────
    "edgartools>=3.0",        # SEC filings + XBRL facts (M2)
    "tavily-python>=0.5",     # external market research (M6)
    "pgvector>=0.3",          # filing_chunks.embedding column type (M5)
    # 2.0.0 deleted mcp.shared.memory.create_connected_server_and_client_session.
    # It stopped being the agent transport in R4 — the loops reach the resident
    # face over HTTP now, on an API 2.0 still has — and survives only as the
    # fixture the offline mount tests build a server with. So the cap guards the
    # test suite rather than the product, and lifting it is a migration those
    # tests have to be rewritten for, not a bump.
    "mcp>=1.28,<2",
    # ─── Multi-user (V2-A) ────────────────────────────────────────────────────
    "pyjwt[crypto]>=2.8",     # verify Clerk RS256 session JWTs against JWKS
    # ─── Harness (V3-B0) ──────────────────────────────────────────────────────
    # Declared, not inherited: it arrives transitively through langchain-core
    # today, and context measurement is not something to leave at the mercy of
    # another package's dependency resolution.
    "tiktoken>=0.7",          # prompt-size measurement (o200k_base, pinned)
    # ─── MCP plan (P1.2) ──────────────────────────────────────────────────────
    # Same reasoning as tiktoken: it is in the environment transitively today,
    # and the gate's argument check is not something to leave to another
    # package's resolver.
    "jsonschema>=4.20",       # tool argument validation at invoke() (Draft 2020-12)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "live: requires network access or API keys (skipped in default `pytest -m 'not live'`)",
]
