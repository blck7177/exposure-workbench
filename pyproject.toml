[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure-workbench"
version = "0.1.0"
description = "Portfolio Exposure Workflow Demo — database-backed analytical workflow with LLM reporting"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "anthropic>=0.28",
    "langgraph>=0.1",
    "langchain-openai>=0.1",
    "yfinance>=0.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    # ─── Issuer Intelligence (P0+) ────────────────────────────────────────────
    "edgartools>=3.0",        # SEC filings + XBRL facts (M2)
    "tavily-python>=0.5",     # external market research (M6)
    "pgvector>=0.3",          # filing_chunks.embedding column type (M5)
    "mcp>=1.2",               # FastMCP server: exposure-workbench tool face (M10)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "live: requires network access or API keys (skipped in default `pytest -m 'not live'`)",
]
