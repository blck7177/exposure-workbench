# V3-D1 retrieval golden set.
#
# Labelled at SECTION level, not passage level, and deliberately so: chunk ids
# are regenerated by every re-ingest, so a set anchored on them measures
# nothing the day after it is written. An SEC item code is stable across
# re-ingest and across chunker settings, and 'did retrieval land in the item
# where the answer lives' is the property that actually degrades when
# retrieval regresses.
#
# The limit that comes with that honesty: this measures section-level recall,
# not passage precision. A run that returns the right item and the wrong
# paragraph scores as a hit here. Passage-level labels would need a human to
# read 3,078 chunks, and are the obvious next step if this number ever stops
# discriminating.
queries:
  - id: aapl_risk
    ticker: AAPL
    intent: risk
    query: "what are the principal risk factors facing the business"
    expect_items: ['Item 1A', 'Part II, Item 1A']
  - id: aapl_mdna
    ticker: AAPL
    intent: mdna
    query: "how does management explain the change in revenue and margins"
    expect_items: ['Item 7', 'Part I, Item 2']
  - id: aapl_financials
    ticker: AAPL
    intent: financials
    query: "total revenue and net income for the most recent period"
    expect_items: ['Item 8', 'Part I, Item 1']
